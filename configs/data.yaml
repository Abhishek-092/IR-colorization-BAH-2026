input_dir: "input"
output_dir: "output"
patches_dir: "output/patches"
downscaled_dir: "output/downscaled_data"

# Scaling configurations (official baseline constants)
scale_factors:
  rgb_downscale: 3.33
  tir_100m_downscale: 3.33
  tir_200m_downscale: 6.67

# Patch generation specifications
patch_sizes:
  tir_200m: 256
  tir_100m: 512
  rgb_100m: 512
  colorization_tir: 256
  colorization_rgb: 256

# Train/Val Splits (full Landsat product IDs — must match folder names under
# patches_dir). Split is product-level so train and val patches come from
# disjoint scenes (no data leakage). Add/remove product IDs as your input/
# folder changes; every ID here must have been processed by prepare_dataset.py.
# Product-disjoint split over the REAL Landsat scenes only.
# Excluded from training:
#   - LC08_134051: mostly cloud (would teach "everything is white").
#   - LC09_146044: synthetic geometric test scene (uint16, but not real ground) —
#     kept in input/ as the physical-calibration demo product, not for training.
splits:
  train:
    - "LC08_L2SP_137041_20260705_20260716_02_T1"
    - "LC08_L2SP_143051_20260629_20260707_02_T1"
    - "LC09_L2SP_136042_20260706_20260707_02_T1"
  val:
    - "LC09_L2SP_146040_20260712_20260713_02_T1"
    - "LC09_L2SP_147046_20260617_20260622_02_T1"
    - "SYN_L9_0009"
